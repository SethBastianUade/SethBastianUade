<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-label="Sebastián Arroyo — Building Reliable Software. Studying Reliable AI.">
  <title>Sebastián Arroyo</title>
  <desc>Building Reliable Software. Studying Reliable AI.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC">
        <animate attributeName="stop-color" values="#F8FAFC;#EEF2F7;#F8FAFC" dur="14s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      </stop>
      <stop offset="1" stop-color="#E5E9F0">
        <animate attributeName="stop-color" values="#E5E9F0;#DDE3EC;#E5E9F0" dur="14s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#14B8A6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>

    <style>
      @media (prefers-reduced-motion: reduce) {
        animate, animateTransform { display: none; }
      }
      .t1 { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: -0.02em; }
      .t2 { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; font-weight: 500; letter-spacing: -0.01em; }
      .sub { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; font-weight: 400; letter-spacing: 0.01em; }
      .meta { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <rect x="24" y="24" width="1232" height="352" rx="14" fill="none" stroke="#0B0F17" stroke-opacity="0.06" stroke-width="1"/>

  <g fill="#475569">
    <circle cx="120" cy="90" r="1.4" opacity="0.45">
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="320" r="1.2" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="110" r="1.6" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="7s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="290" r="1.2" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="9s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="60" r="1" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.45;0.1" dur="10s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="350" r="1" opacity="0.35">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="11s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="80" y="120" class="meta" font-size="12" fill="#475569">Sebastián Arroyo · Research Notebook</text>

  <text x="80" y="200" class="t1" font-size="52" fill="#0B0F17">Building Reliable Software.</text>
  <text x="80" y="258" class="t2" font-size="52" fill="#475569">Studying Reliable AI.</text>

  <text x="80" y="300" class="sub" font-size="15" fill="#475569">Backend engineering · AI Safety · AI-powered systems</text>

  <rect x="80" y="150" width="36" height="2" rx="1" fill="#3B82F6"/>
</svg>
